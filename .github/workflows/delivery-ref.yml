name: Delivery ref

# Every delivery workflow calls this before a job loads the release
# Environment. The guard is the dispatch ref plus an exact main SHA that is
# still the head when the run starts and that CI passed on. Later jobs check
# out that SHA, so commits landing meanwhile never change what ships.
on:
  workflow_call:
    inputs:
      expected_sha:
        description: Full SHA of the main commit to deliver
        required: true
        type: string
    outputs:
      sha:
        description: Validated commit to check out
        value: ${{ jobs.validate.outputs.sha }}

permissions: {}

jobs:
  validate:
    name: Validate main at the expected SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Require main at the expected SHA with CI passed
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "Delivery runs only from main, not $RUN_REF" >&2
            exit 1
          fi

          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi

          if [ "$EXPECTED_SHA" != "$RUN_SHA" ]; then
            echo "This run is for $RUN_SHA, not the expected $EXPECTED_SHA" >&2
            exit 1
          fi

          head="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$head" != "$RUN_SHA" ]; then
            echo "main moved to $head after this run started" >&2
            exit 1
          fi

          # Every push to main runs the full gate, so a passed push run is verify on this SHA.
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RUN_SHA&event=push&status=success" --jq .total_count)"
          if [ "$passed" = 0 ]; then
            echo "CI has not passed on $RUN_SHA; wait for its push run or rerun it" >&2
            exit 1
          fi

          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
