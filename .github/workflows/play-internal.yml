name: Google Play Internal

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the main commit to ship
        required: true
        type: string
      version_name:
        description: Version name of both apps, for example 3.0.0
        required: true
        type: string
      dry_run:
        description: Upload both bundles to a Google Play edit, then discard it instead of committing
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: play-delivery
  cancel-in-progress: false

# Explicit bash runs with -o pipefail; GitHub's default shell does not.
defaults:
  run:
    shell: bash

jobs:
  ref:
    name: Validate ref
    uses: ./.github/workflows/delivery-ref.yml # zizmor: ignore[self-repository]
    permissions:
      actions: read
      contents: read
    with:
      expected_sha: ${{ inputs.expected_sha }}

  inputs:
    name: Validate inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      version_name: ${{ steps.inputs.outputs.version_name }}
    steps:
      # Gradle checks the full range; this keeps the name safe for tags and shells.
      - name: Validate inputs
        id: inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[1-9][0-9]{0,3}\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "version_name must look like 3.0.0" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

  notes:
    name: Write release notes
    needs: [ref, inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find the previous version's last tag
        id: base
        env:
          VERSION_NAME: ${{ needs.inputs.outputs.version_name }}
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "v${VERSION_NAME}" HEAD^ 2>/dev/null)" || base=""
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        id: notes
        uses: putdotio/.github/.github/actions/beta-notes@32b9f2f9ac2b6b17b2be6b111ec495e079384b4c # v2.3.1
        with:
          app: put.io for Android
          base: ${{ steps.base.outputs.base }}
          max-length: 500

  upload:
    name: Upload to the internal track
    needs: [ref, inputs, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      # Signed builds start from scratch, without dependency caches.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-disabled: true
      - name: Write the release notes file
        env:
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          mkdir -p mobile/src/main/play/release-notes/en-US
          printf '%s\n' "$NOTES" > mobile/src/main/play/release-notes/en-US/internal.txt
      - name: Write the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      # Without the configuration cache, so no signing password lands on disk.
      - name: Build, sign and upload
        env:
          VERSION_NAME: ${{ needs.inputs.outputs.version_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUTIO_SENTRY_DSN: ${{ vars.PUTIO_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          for name in ANDROID_PUBLISHER_CREDENTIALS PUTIO_SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_PROJECT; do
            if [ -z "${!name}" ]; then
              echo "The release Environment must set $name" >&2
              exit 1
            fi
          done
          no_commit=()
          if [ "$DRY_RUN" = true ]; then no_commit=(--no-commit); fi
          ./gradlew --no-daemon --no-configuration-cache -PputioVersionName="$VERSION_NAME" \
            :mobile:publishProductionReleaseBundle --release-status completed "${no_commit[@]}"

  tag:
    name: Tag the uploaded commit
    if: ${{ !inputs.dry_run }}
    needs: [ref, inputs, upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - name: Mint a putio-ci token for tagging
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PUTIO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create v${{ needs.inputs.outputs.version_name }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.inputs.outputs.version_name }}
          SHA: ${{ needs.ref.outputs.sha }}
        run: |
          tag="v$VERSION"
          # gh prints a 404's body to stdout, so only its exit status says whether the tag exists.
          if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<< "$ref")")"
            if [ "$(jq -r .object.type <<< "$ref")" != tag ] || [ "$(jq -r .object.sha <<< "$existing")" != "$SHA" ]; then
              echo "$tag already exists for another commit" >&2
              exit 1
            fi
          else
            object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f object="$SHA" -f type=commit \
              -f message="put.io Android $VERSION" | jq -r .sha)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" > /dev/null
          fi
          echo "- Tagged \`$tag\` at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
