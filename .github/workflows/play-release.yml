name: Google Play Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the current main commit
        required: true
        type: string
      from_track:
        description: internal promotes that track's release to production; production changes a staged production rollout, never a completed release
        required: true
        type: choice
        options: [internal, production]
        default: internal
      rollout_percent:
        description: Share of production users, 1 to 100; below 100 is a staged rollout
        required: true
        type: string
        default: "10"
      publish_listing:
        description: Also replace the Google Play listing with mobile/src/main/play/listings
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: play-delivery
  cancel-in-progress: false

# Explicit bash runs with -o pipefail; GitHub's default shell does not.
defaults:
  run:
    shell: bash

jobs:
  ref:
    name: Validate ref
    uses: ./.github/workflows/delivery-ref.yml # zizmor: ignore[self-repository]
    permissions:
      actions: read
      contents: read
    with:
      expected_sha: ${{ inputs.expected_sha }}

  release:
    name: Release to production
    needs: ref
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        env:
          FROM_TRACK: ${{ inputs.from_track }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
        run: |
          if [ "$FROM_TRACK" != internal ] && [ "$FROM_TRACK" != production ]; then
            echo "from_track must be internal or production" >&2
            exit 1
          fi
          if ! [[ "$ROLLOUT_PERCENT" =~ ^[1-9][0-9]?$|^100$ ]]; then
            echo "rollout_percent must be an integer from 1 to 100" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ref.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true
      # Promotion copies every version code in the internal release, so both apps move together.
      - name: Promote or change the rollout
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FROM_TRACK: ${{ inputs.from_track }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
        run: |
          if [ "$ROLLOUT_PERCENT" = 100 ]; then
            rollout=(--release-status completed)
          else
            rollout=(--release-status inProgress --user-fraction "0.$(printf '%02d' "$ROLLOUT_PERCENT")")
          fi
          ./gradlew --no-daemon :mobile:promoteProductionReleaseArtifact \
            --from-track "$FROM_TRACK" --promote-track production "${rollout[@]}"
      # After the release, so a failed promotion changes nothing else.
      - name: Replace the listing
        if: ${{ inputs.publish_listing }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew --no-daemon :mobile:publishProductionReleaseListing
      - name: Summarize
        env:
          FROM_TRACK: ${{ inputs.from_track }}
          ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          SHA: ${{ needs.ref.outputs.sha }}
          LISTING: ${{ inputs.publish_listing }}
        run: |
          {
            echo "### Google Play release"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$SHA\` |"
            echo "| From track | $FROM_TRACK |"
            echo "| Production rollout | $ROLLOUT_PERCENT% |"
            echo "| Listing replaced | $LISTING |"
            echo "| Run | [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
          } >> "$GITHUB_STEP_SUMMARY"
