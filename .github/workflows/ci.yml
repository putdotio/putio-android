name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share a group per ref so a new push cancels the stale run. Every
# other run gets its own group: each main commit keeps its verdict, and no push
# replaces a queued one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Pushes and dispatches verify everything. A pull request whose every path
    # is docs skips verify; unlisted paths count as code.
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'

  # `verify` runs as two parallel jobs that together run exactly its tasks: the
  # minified release builds here, everything else plus the debug assembles in
  # `verify`.
  release:
    name: Build release
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: putio-android
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Assemble release builds
        working-directory: putio-android
        run: >-
          ./gradlew :mobile:assembleProductionRelease :tv:assembleProductionRelease
          :tv:assembleNightlyRelease

  verify:
    name: Verify Android app
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: putio-android
          persist-credentials: false

      - name: Record source revisions
        run: |
          app_revision=$(git -C putio-android rev-parse HEAD)
          app_parents=$(git -C putio-android log -1 --format=%P | tr ' ' '\n' | sed 's/^/App parent revision: /')
          printf 'App revision: %s\n' "$app_revision" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$app_parents" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Install evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Verify and assemble all flavors
        working-directory: putio-android
        run: >-
          ./gradlew verify -x :mobile:assembleProductionRelease -x :tv:assembleProductionRelease
          -x :tv:assembleNightlyRelease
          :mobile:assembleProductionDebug :tv:assembleProductionDebug
          :mobile:assembleNightlyDebug :tv:assembleNightlyDebug

      - name: Upload failed unit test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-unit-test-reports
          if-no-files-found: warn
          path: |
            putio-android/mobile/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/tv/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/core/*/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/domain/*/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/build-logic/build/test-results/test/TEST-*.xml
          retention-days: 3

      - name: Upload debug APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apks
          if-no-files-found: error
          path: |
            putio-android/mobile/build/outputs/apk/*/debug/*.apk
            putio-android/tv/build/outputs/apk/*/debug/*.apk
          retention-days: 1
