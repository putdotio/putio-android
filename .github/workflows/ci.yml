name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share a group per ref so a new push cancels the stale run. Every
# other run gets its own group: each main commit keeps its verdict, and no push
# replaces a queued one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
      any: ${{ steps.lanes.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select lanes
        id: lanes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' > changed-paths.txt
            matrix="$(python3 -B scripts/ci_lanes.py --matrix < changed-paths.txt)"
          else
            matrix="$(python3 -B scripts/ci_lanes.py --matrix --all < /dev/null)"
          fi
          any="$(jq -r '.include | length > 0' <<<"$matrix")"
          printf 'matrix=%s\nany=%s\n' "$matrix" "$any" >> "$GITHUB_OUTPUT"
          jq -r '"Lanes: " + ([.include[].name] | join(", ") | if . == "" then "none" else . end)' <<<"$matrix" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check Markdown links
        if: ${{ !cancelled() }}
        uses: putdotio/.github/.github/actions/links@e07dede03892f9b80fec82bf38afcd5f76b763b0 # v2.3.3

      - name: Scan secrets and workflows
        if: ${{ !cancelled() }}
        uses: putdotio/.github/.github/actions/scan@e07dede03892f9b80fec82bf38afcd5f76b763b0 # v2.3.3

  lane:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: putio-android
          persist-credentials: false

      - name: Record source revisions
        run: |
          app_revision=$(git -C putio-android rev-parse HEAD)
          app_parents=$(git -C putio-android log -1 --format=%P | tr ' ' '\n' | sed 's/^/App parent revision: /')
          printf 'App revision: %s\n' "$app_revision" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$app_parents" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install evidence dependencies
        if: matrix.ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: putio-android/.node-version

      - name: Fetch brand fonts
        if: matrix.brand_fonts
        working-directory: putio-android
        run: ./scripts/sync-brand-fonts.sh

      - name: Run lane
        working-directory: putio-android
        env:
          TASKS: ${{ matrix.tasks }}
        run: |
          read -ra tasks <<<"$TASKS"
          ./gradlew --stacktrace "${tasks[@]}"

      - name: Upload failed unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-unit-test-reports-${{ matrix.lane }}
          if-no-files-found: warn
          path: |
            putio-android/mobile/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/tv/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/core/*/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/domain/*/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/build-logic/build/test-results/test/TEST-*.xml
          retention-days: 3

      - name: Upload debug APKs
        if: github.event_name == 'workflow_dispatch' && matrix.upload_apks != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks-${{ matrix.lane }}
          if-no-files-found: error
          path: ${{ matrix.upload_apks }}
          retention-days: 1
