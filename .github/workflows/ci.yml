name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share a group per ref so a new push cancels the stale run. Every
# other run gets its own group: each main commit keeps its verdict, and no push
# replaces a queued one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.markdown == 'true' }}
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!{.agents,.claude,docs,play,.github/ISSUE_TEMPLATE}/**'
              - '!.github/workflows/{delivery-ref,emulator-smoke,play-data-safety,play-internal,play-release}.yml'
              - '!{LICENSE,NOTICE,renovate.json,skills-lock.json,.worktreeinclude}'
            markdown:
              - '**/*.md'

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: putdotio/.github/.github/actions/links@e07dede03892f9b80fec82bf38afcd5f76b763b0 # v2.3.3

      - name: Scan secrets and workflows
        if: ${{ !cancelled() }}
        uses: putdotio/.github/.github/actions/scan@e07dede03892f9b80fec82bf38afcd5f76b763b0 # v2.3.3

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TASKS: verifyDocs
    steps: &lane
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install evidence dependencies
        if: env.FFMPEG == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Fetch brand fonts
        if: env.BRAND_FONTS == 'true'
        run: ./scripts/sync-brand-fonts.sh

      - name: Run Gradle
        run: |
          read -ra tasks <<<"$TASKS"
          ./gradlew --stacktrace "${tasks[@]}"

      - name: Test harness scripts
        if: env.HARNESS_TESTS == 'true'
        run: |
          bash scripts/test-evidence.sh
          bash scripts/test-emulator.sh
          bash scripts/test-sign-in.sh

      - name: Upload failed unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-unit-test-reports-${{ github.job }}
          if-no-files-found: ignore
          path: |
            mobile/build/test-results/test*UnitTest/TEST-*.xml
            tv/build/test-results/test*UnitTest/TEST-*.xml
            core/*/build/test-results/test*UnitTest/TEST-*.xml
            domain/*/build/test-results/test*UnitTest/TEST-*.xml
            build-logic/build/test-results/test/TEST-*.xml
          retention-days: 3

      - name: Upload debug APKs
        if: github.event_name == 'workflow_dispatch' && env.APKS != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks-${{ github.job }}
          if-no-files-found: error
          path: ${{ env.APKS }}
          retention-days: 1

  scripts:
    name: Scripts
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TASKS: verifyScripts
      FFMPEG: 'true'
      HARNESS_TESTS: 'true'
    steps: *lane

  libraries:
    name: Libraries
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TASKS: verifyLibraries
    steps: *lane

  mobile:
    name: Mobile
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TASKS: verifyMobile :mobile:assembleProductionDebug
      APKS: mobile/build/outputs/apk/production/debug/*.apk
    steps: *lane

  tv:
    name: TV
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TASKS: verifyTv :tv:assembleProductionDebug
      APKS: tv/build/outputs/apk/production/debug/*.apk
    steps: *lane

  release:
    name: Release
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TASKS: verifyRelease
      BRAND_FONTS: 'true'
    steps: *lane

  nightly:
    name: Nightly debug
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TASKS: :mobile:assembleNightlyDebug :tv:assembleNightlyDebug
      APKS: |
        mobile/build/outputs/apk/nightly/debug/*.apk
        tv/build/outputs/apk/nightly/debug/*.apk
    steps: *lane
