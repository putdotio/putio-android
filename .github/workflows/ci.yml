name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: putio-android
          persist-credentials: false

      # The app consumes putio-sdk-kotlin as a composite build from a sibling
      # checkout (settings.gradle.kts default ../putio-sdk-kotlin). The SDK is
      # public, so no credential is needed until it ships as a Maven artifact.
      - name: Check out putio-sdk-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: putdotio/putio-sdk-kotlin
          path: putio-sdk-kotlin
          persist-credentials: false

      - name: Record source revisions
        run: |
          app_revision=$(git -C putio-android rev-parse HEAD)
          sdk_revision=$(git -C putio-sdk-kotlin rev-parse HEAD)
          app_parents=$(git -C putio-android log -1 --format=%P | tr ' ' '\n' | sed 's/^/App parent revision: /')
          printf 'App revision: %s\nKotlin SDK revision: %s\n' "$app_revision" "$sdk_revision" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$app_parents" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Install evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Verify and assemble all flavors
        working-directory: putio-android
        run: >-
          ./gradlew verify :buildSrc:test
          :app:assembleMobileProductionDebug :app:assembleTvProductionDebug
          :app:assembleMobileNightlyDebug :app:assembleTvNightlyDebug

      - name: Upload failed unit test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-unit-test-reports
          if-no-files-found: warn
          path: |
            putio-android/app/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/buildSrc/build/test-results/test/TEST-*.xml
          retention-days: 3

      - name: Upload debug APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apks
          if-no-files-found: error
          path: |
            putio-android/app/build/outputs/apk/*/debug/*.apk
          retention-days: 1
