name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android app
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: putio-android
          persist-credentials: false

      # The app consumes putio-sdk-kotlin as a composite build from a sibling
      # checkout (settings.gradle.kts default ../putio-sdk-kotlin). The repo is
      # private; access is a read-only deploy key stored as an Actions secret.
      - name: Check out putio-sdk-kotlin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: putdotio/putio-sdk-kotlin
          ssh-key: ${{ secrets.PUTIO_SDK_KOTLIN_DEPLOY_KEY }}
          path: putio-sdk-kotlin
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          validate-wrappers: true

      - name: Install evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg locales
          sudo locale-gen de_DE.UTF-8

      - name: Verify and assemble all flavors
        working-directory: putio-android
        run: >-
          ./gradlew verify :buildSrc:test
          :app:assembleMobileProductionDebug :app:assembleTvProductionDebug
          :app:assembleMobileNightlyDebug :app:assembleTvNightlyDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apks
          if-no-files-found: error
          path: |
            putio-android/app/build/outputs/apk/*/debug/*.apk
