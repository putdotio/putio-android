name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share a group per ref so a new push cancels the stale run. Every
# other run gets its own group: each main commit keeps its verdict, and no push
# replaces a queued one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Pushes and dispatches verify everything. A pull request whose every path
    # is docs skips verify; unlisted paths count as code. `verify` also checks
    # Markdown; `markdown` covers pull requests that change Markdown, including
    # the docs-only ones that skip verify. This job runs on every event, so it
    # also checks Markdown links and scans each pushed range. A link or scan
    # failure fails this job without skipping the jobs below, which use
    # `!cancelled()`.
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      markdown: ${{ github.event_name == 'pull_request' && steps.filter.outputs.markdown == 'true' }}
    steps:
      - name: Classify changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
            markdown:
              - '**/*.md'

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: putdotio/.github/.github/actions/links@32b9f2f9ac2b6b17b2be6b111ec495e079384b4c # v2.3.1

      - name: Scan secrets and workflows
        if: ${{ !cancelled() }}
        uses: putdotio/.github/.github/actions/scan@32b9f2f9ac2b6b17b2be6b111ec495e079384b4c # v2.3.1

  markdown:
    name: Check Markdown
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Check Markdown formatting
        run: ./gradlew --stacktrace markdownCheck

  # `verify` runs as two parallel jobs that together run exactly its tasks: the
  # minified release builds here, everything else plus the debug assembles in
  # `verify`.
  release:
    name: Build release
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: putio-android
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # Release builds embed the public licensed fonts as Google Play bundles do. `verify`
      # stays without them, like a fresh clone, and it is the job that uploads debug APKs.
      - name: Fetch brand fonts
        working-directory: putio-android
        run: ./scripts/sync-brand-fonts.sh

      - name: Assemble release builds
        working-directory: putio-android
        run: >-
          ./gradlew --stacktrace :mobile:assembleProductionRelease :tv:assembleProductionRelease
          :tv:assembleNightlyRelease

  verify:
    name: Verify Android app
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: putio-android
          persist-credentials: false

      - name: Record source revisions
        run: |
          app_revision=$(git -C putio-android rev-parse HEAD)
          app_parents=$(git -C putio-android log -1 --format=%P | tr ' ' '\n' | sed 's/^/App parent revision: /')
          printf 'App revision: %s\n' "$app_revision" | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$app_parents" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: putio-android/.node-version

      - name: Install evidence dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Verify and assemble all flavors
        working-directory: putio-android
        run: >-
          ./gradlew --stacktrace verify -x :mobile:assembleProductionRelease -x :tv:assembleProductionRelease
          -x :tv:assembleNightlyRelease
          :mobile:assembleProductionDebug :tv:assembleProductionDebug
          :mobile:assembleNightlyDebug :tv:assembleNightlyDebug

      - name: Upload failed unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-unit-test-reports
          if-no-files-found: warn
          path: |
            putio-android/mobile/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/tv/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/core/*/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/domain/*/build/test-results/test*UnitTest/TEST-*.xml
            putio-android/build-logic/build/test-results/test/TEST-*.xml
          retention-days: 3

      - name: Upload debug APKs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apks
          if-no-files-found: error
          path: |
            putio-android/mobile/build/outputs/apk/*/debug/*.apk
            putio-android/tv/build/outputs/apk/*/debug/*.apk
          retention-days: 1
