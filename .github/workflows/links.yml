name: Links

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# Same policy as CI: a new pull-request push cancels the stale run; every main
# commit keeps its own verdict.
concurrency:
  group: links-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    permissions:
      contents: read
    uses: putdotio/.github/.github/workflows/frontend-links.yml@1ee0d3b473cbc6fada08831f01ff80fe653c434a # v1.1.0
