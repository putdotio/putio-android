version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      gradle-patch-minor:
        update-types: ["patch", "minor"]
      gradle-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      npm-patch-minor:
        update-types: ["patch", "minor"]
      npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore"
