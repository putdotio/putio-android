# detekt configuration (merged on top of the bundled defaults via
# buildUponDefaultConfig). Only deviations from the defaults live here —
# mostly Compose idioms the default Kotlin rules reject.

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable', 'Preview']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    # The bundled test-path excludes, plus test fixtures shared between modules.
    excludes: ['**/test/**', '**/testFixtures/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
